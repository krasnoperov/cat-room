<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Room</title>
<meta name="description" content="A small room by a big window. Arrange things, watch the light move, and the cat will find the warm spot.">
<meta property="og:title" content="Cat Room">
<meta property="og:description" content="A small room by a big window. Arrange things, watch the light move, and the cat will find the warm spot.">
<meta property="og:image" content="https://rooms.krasnoperov.me/img/og.jpg">
<meta property="og:url" content="https://rooms.krasnoperov.me/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#bcd7ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Nunito:wght@500;600;700&display=swap">
<style>
  :root {
    --sky-top: #bcd7ee;
    --sky-bottom: #f1e9e2;
    --ink: #41384d;
    --ink-2: #6d6479;
    --glass: rgba(255, 250, 243, 0.74);
    --glass-edge: rgba(255, 255, 255, 0.7);
    --line: rgba(65, 56, 77, 0.12);
    --accent: #e0894a;
    --f-title: "Fraunces", Georgia, serif;
    --f-ui: "Nunito", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  body.night { --ink: #f3ecf6; --ink-2: #c9bfd8; }
  body.night .dock { --ink: #41384d; --ink-2: #6d6479; }
  .brand, .hint { transition: color 1.2s ease, opacity 0.4s ease; }
  .dock { transition: opacity 0.4s ease; }
  body.photo .brand, body.photo .hint, body.photo .dock,
  body.recording .brand, body.recording .hint, body.recording .dock { opacity: 0; pointer-events: none; }
  .bar {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 8px;
    border-radius: 999px; background: rgba(255, 250, 243, 0.8); border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 10px 30px rgba(65, 56, 77, 0.16);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    white-space: nowrap;
  }
  .bar-hint { font: 600 12.5px/1 var(--f-ui); color: #6d6479; padding: 0 6px 0 10px; }
  .bar-text { font: 700 13px/1 var(--f-ui); color: #41384d; font-variant-numeric: tabular-nums; padding-right: 4px; }
  .rec-dot { width: 10px; height: 10px; margin-left: 8px; border-radius: 50%; background: #e0584a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .pill {
    height: 36px; padding: 0 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(65, 56, 77, 0.14); background: rgba(255, 255, 255, 0.7); color: #41384d;
    font: 700 13px/1 var(--f-ui);
  }
  .pill:hover { background: #fff; }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.primary:hover { background: #d27a3c; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .radio {
    position: fixed; left: 28px; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px;
    border-radius: 999px; background: rgba(255, 250, 243, 0.78); border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 24px rgba(65, 56, 77, 0.12);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #41384d; transition: opacity 0.4s ease;
  }
  body.photo .radio, body.recording .radio { opacity: 0; pointer-events: none; }
  .radio-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .radio-text b { font: 700 13px/1.1 var(--f-ui); white-space: nowrap; }
  .radio-text em { font: italic 400 12px/1.1 var(--f-title); color: #6d6479; white-space: nowrap; }
  .radio-btn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: #41384d; cursor: pointer; display: grid; place-items: center; }
  .radio-btn:hover { background: rgba(65, 56, 77, 0.08); }
  .radio-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .radio-btn svg { width: 16px; height: 16px; }
  .eq { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .eq i { width: 3px; border-radius: 2px; background: var(--accent); animation: eq 1.1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.7s; } .eq i:nth-child(4) { animation-delay: -0.5s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 15px; } }
  @media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 9px; } }
  @media (max-width: 720px) { .radio { left: auto; right: 16px; bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); } .radio-text em { display: none; } }
  .toast {
    position: fixed; left: 50%; top: calc(24px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    padding: 10px 14px; border-radius: 12px; background: rgba(50, 43, 60, 0.9); color: #fbf5ec;
    font: 600 13px/1.25 var(--f-ui); max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center;
  }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    color: var(--ink);
    font-family: var(--f-ui);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #gl.grab { cursor: grab; }
  #gl.grabbing { cursor: grabbing; }
  #gl.point { cursor: pointer; }

  .brand {
    position: fixed; left: 28px; top: calc(24px + env(safe-area-inset-top, 0px));
    max-width: 320px; pointer-events: none;
  }
  .brand h1 { margin: 0; font: 500 30px/1.05 var(--f-title); letter-spacing: -0.01em; }
  .brand p { margin: 8px 0 0; font: italic 400 15px/1.4 var(--f-title); color: var(--ink-2); }

  .dock {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 8px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    box-shadow: 0 10px 30px rgba(65, 56, 77, 0.14);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    max-width: calc(100vw - 32px);
    color: var(--ink);
    box-sizing: border-box;
  }
  .dock button {
    width: 36px; height: 36px; flex: none;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .dock button:hover { background: rgba(65, 56, 77, 0.08); }
  .dock button[aria-pressed="true"] { background: rgba(110, 140, 190, 0.2); color: #3d5a8a; }
  .dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dock svg { width: 18px; height: 18px; }
  .clock { font: 700 15px/1 var(--f-ui); font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
  .sep { width: 1px; height: 22px; background: var(--line); flex: none; }
  .field { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--f-ui); color: var(--ink-2); }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 24px; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(65, 56, 77, 0.16); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(65, 56, 77, 0.16); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  #time { width: 220px; }
  #cut { width: 90px; }

  .tip {
    position: fixed; left: 0; top: 0; pointer-events: none;
    padding: 7px 11px; border-radius: 10px;
    background: rgba(50, 43, 60, 0.88); color: #fbf5ec;
    font: 600 12.5px/1.3 var(--f-ui);
    white-space: nowrap;
    transform: translate(14px, 14px);
  }
  .tip em { font-style: normal; color: #f4c08e; }
  .hint {
    position: fixed; right: 28px; top: calc(28px + env(safe-area-inset-top, 0px));
    max-width: 240px; text-align: right;
    font: 600 12px/1.55 var(--f-ui); color: var(--ink-2);
    pointer-events: none;
  }
  .hint b { color: var(--ink); font-weight: 700; }

  @media (max-width: 720px) {
    .brand { left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
    .brand h1 { font-size: 24px; }
    .brand p { font-size: 13px; max-width: 240px; }
    .hint { display: none; }
    .dock { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); gap: 4px; flex-wrap: wrap; justify-content: center; border-radius: 22px; width: calc(100vw - 32px); }
    #time { width: auto; flex: 1 1 140px; }
    .sep { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="A small room with a cat. Drag furniture; click the window, lantern, tea and books."></canvas>

<div class="brand">
  <h1>Cat Room</h1>
  <p>Arrange things, watch the light move. The cat will find the warm spot.</p>
</div>

<div class="hint">
  <b>Drag</b> furniture · <b>R</b> turns it<br>
  <b>Click</b> the window, lantern, tea, books<br>
  Pick up the cat if you must
</div>

<div class="dock" role="toolbar" aria-label="Room controls">
  <button id="play" type="button" aria-label="Pause time">
    <svg id="icon-pause" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.2" height="12" rx="1"/><rect x="11.8" y="4" width="3.2" height="12" rx="1"/></svg>
    <svg id="icon-play" viewBox="0 0 20 20" fill="currentColor" hidden><path d="M6 4.2v11.6c0 .6.7 1 1.2.6l8.4-5.8c.4-.3.4-1 0-1.3L7.2 3.6C6.7 3.2 6 3.6 6 4.2z"/></svg>
  </button>
  <span class="clock" id="clock" aria-live="off">17:00</span>
  <input id="time" type="range" min="0" max="1440" step="1" aria-label="Time of day">
  <span class="sep"></span>
  <button id="rotL" type="button" aria-label="Turn the room left">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5A6 6 0 1 1 5 13"/><path d="M4 4v4.5h4.5"/></svg>
  </button>
  <button id="rotR" type="button" aria-label="Turn the room right">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8.5A6 6 0 1 0 15 13"/><path d="M16 4v4.5h-4.5"/></svg>
  </button>
  <span class="sep"></span>
  <label class="field">Walls <input id="cut" type="range" min="0.3" max="2.7" step="0.01" value="2.7" aria-label="Wall height"></label>
  <span class="sep"></span>
  <button id="radioBtn" type="button" aria-label="Room radio" aria-pressed="false" title="Room radio">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 14.5V5l8-1.6v9.4"/><circle cx="5.6" cy="14.6" r="1.9"/><circle cx="13.6" cy="12.9" r="1.9"/></svg>
  </button>
  <button id="rain" type="button" aria-label="Rain" aria-pressed="false" title="Rain">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5h8.2a3 3 0 0 0 .4-6A4.6 4.6 0 0 0 5.8 7.4 2.6 2.6 0 0 0 6 12.5z"/><path d="M7.5 15l-.7 1.6M10.6 15l-.7 1.6M13.7 15l-.7 1.6"/></svg>
  </button>
  <button id="photo" type="button" aria-label="Photo mode" title="Photo mode">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7.2c0-.9.7-1.6 1.6-1.6h1.9l1.3-1.9h4.4l1.3 1.9h1.9c.9 0 1.6.7 1.6 1.6v7.2c0 .9-.7 1.6-1.6 1.6H4.6c-.9 0-1.6-.7-1.6-1.6z"/><circle cx="10" cy="10.6" r="3"/></svg>
  </button>
  <button id="record" type="button" aria-label="Record a day as a video" title="Record a day">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3" fill="#e0584a" stroke="none"/></svg>
  </button>
  <button id="share" type="button" aria-label="Copy a link to this room" title="Share this room">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8.6 11.4a3.2 3.2 0 0 0 4.5 0l2.6-2.6a3.2 3.2 0 0 0-4.5-4.5l-1 1"/><path d="M11.4 8.6a3.2 3.2 0 0 0-4.5 0l-2.6 2.6a3.2 3.2 0 0 0 4.5 4.5l1-1"/></svg>
  </button>
</div>

<div class="tip" id="tip" hidden></div>

<div class="bar" id="photobar" hidden>
  <span class="bar-hint">Tap the room to focus</span>
  <button id="snap" type="button" class="pill primary">Save picture</button>
  <button id="photoDone" type="button" class="pill">Done</button>
</div>
<div class="bar" id="rec" hidden>
  <i class="rec-dot"></i><span class="bar-text" id="recText">Recording the day</span>
  <button id="recStop" type="button" class="pill">Stop</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="radio" id="radio" hidden>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="radio-text"><b id="trackTitle">Cat Room Radio</b><em>Cat Room Radio · lo-fi</em></span>
  <button id="nextTrack" type="button" class="radio-btn" aria-label="Next track" title="Next track">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4.5 5.2v9.6c0 .6.7 1 1.2.6L12 10.6c.4-.3.4-1 0-1.3L5.7 4.6c-.5-.4-1.2 0-1.2.6z"/><rect x="13.2" y="4.5" width="2.4" height="11" rx="1"/></svg>
  </button>
</div>

<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (dt, rate) => 1 - Math.exp(-dt * rate);
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? parseFloat(params.get(k)) : d);

/* ===================================================================
   ROOM  (metres).  Four walls around a 4 x 4 floor; the window is in
   the west wall (x = -HW), the shelves hang on the north wall.
   =================================================================== */
const HW = 2, H = 2.7, T = 0.12;
const WIN = { u0: -1.3, u1: 0.5, y0: 0.6, y1: 2.25 };
const NEAR_CUT = 0.3;
const SEAT = { x0: -HW, x1: -1.45, z0: -1.35, z1: 0.55, top: 0.52 };

/* ---------------- renderer ---------------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, stencil: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
/* Layer 1 holds what the ink pass must not outline: light, air, glass, the sun's invisible room. */
const noInk = (o) => { o.traverse((c) => c.layers.set(1)); return o; };

/* ---------------- materials ---------------- */
const gradData = new Uint8Array([120, 120, 120, 255, 178, 178, 178, 255, 222, 222, 222, 255, 255, 255, 255, 255]);
const gradient = new THREE.DataTexture(gradData, 4, 1, THREE.RGBAFormat);
gradient.minFilter = gradient.magFilter = THREE.NearestFilter;
gradient.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...extra });

const loader = new THREE.TextureLoader();
function tex(path) {
  const t = loader.load(path);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

const planks = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(11), rows = 7, rh = h / rows;
  for (let i = 0; i < rows; i++) {
    let x = -r() * 320;
    while (x < w) {
      const len = 280 + r() * 380;
      g.fillStyle = `hsl(${30 + r() * 3}, ${44 + r() * 5}%, ${69 + r() * 4}%)`;
      g.fillRect(x, i * rh, len, rh);
      g.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        g.strokeStyle = `rgba(125, 72, 32, ${0.04 + r() * 0.05})`;
        const y0 = i * rh + 6 + r() * (rh - 12);
        g.beginPath(); g.moveTo(x, y0);
        g.bezierCurveTo(x + len * 0.3, y0 + (r() - 0.5) * 12, x + len * 0.65, y0 + (r() - 0.5) * 12, x + len, y0 + (r() - 0.5) * 8);
        g.stroke();
      }
      g.fillStyle = 'rgba(95, 55, 28, 0.38)';
      g.fillRect(x, i * rh, 2.5, rh);
      x += len;
    }
    g.fillStyle = 'rgba(95, 55, 28, 0.42)';
    g.fillRect(0, i * rh, w, 2.5);
  }
}, [3, 3]);

const plaster = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#f7ede0'; g.fillRect(0, 0, w, h);
  const r = rng(5);
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(150,120,110,0.035)';
    const s = 1 + r() * 3;
    g.beginPath(); g.arc(r() * w, r() * h, s, 0, Math.PI * 2); g.fill();
  }
}, [2, 2]);

const paperTex = canvasTex(256, 360, (g, w, h) => {
  g.fillStyle = '#fbf7ef'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(120, 140, 180, 0.35)'; g.lineWidth = 2;
  for (let y = 60; y < h - 20; y += 22) { g.beginPath(); g.moveTo(24, y); g.lineTo(w - 24, y); g.stroke(); }
  g.strokeStyle = 'rgba(70, 60, 90, 0.55)'; g.lineWidth = 3;
  const r = rng(3);
  for (let y = 56; y < h - 60; y += 22) {
    if (r() < 0.25) continue;
    g.beginPath(); g.moveTo(28, y - 4);
    let x = 28; const end = 60 + r() * (w - 100);
    while (x < end) { x += 6; g.lineTo(x, y - 4 - Math.sin(x * 0.5) * 3); }
    g.stroke();
  }
});

const M = {
  wall: toon('#fbf4ec'),
  wallTop: toon('#e6dbe6'),
  floor: toon('#fff4ea', { map: planks }),
  wood: toon('#c98d57'),
  woodDark: toon('#9b6440'),
  woodLight: toon('#dcb07c'),
  linen: toon('#f6efe2'),
  cushion: toon('#efe4d2'),
  pillowA: toon('#f1d58a'),
  pillowB: toon('#e6cfe0'),
  throwLav: toon('#c7b6dc'),
  terracotta: toon('#c9714a'),
  soil: toon('#5a4032'),
  leaf: toon('#4f8d4a', { side: THREE.DoubleSide }),
  leafLight: toon('#6aa65a', { side: THREE.DoubleSide }),
  stem: toon('#5d8a44'),
  lemon: toon('#f2cd4b'),
  white: toon('#fbf8f2'),

/* Section caps: where a wall is cut, its top is a hatched section. */
const hatch = new THREE.ShaderMaterial({
  uniforms: { uA: { value: new THREE.Color('#b3a2c4') }, uB: { value: new THREE.Color('#d2c6dd') } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 uA; uniform vec3 uB; varying vec3 vW;
    void main(){ float s = fract((vW.x + vW.z + vW.y) * 11.0); float l = smoothstep(0.0, 0.06, s) * smoothstep(0.34, 0.28, s);
      gl_FragColor = vec4(mix(uA, uB, l), 1.0);

/* ---------------- clip planes: y <= cut, per wall ---------------- */
const WALL_KEYS = ['W', 'N', 'E', 'S'];
const WALLS = {
  W: { axis: 'x', pos: -HW, out: -1, span: [-HW - T, HW + T], hole: WIN },
  E: { axis: 'x', pos: HW, out: 1, span: [-HW - T, HW + T] },
  N: { axis: 'z', pos: -HW, out: -1, span: [-HW, HW] },
  S: { axis: 'z', pos: HW, out: 1, span: [-HW, HW] },
};
const clip = {};
for (const k of WALL_KEYS) {
  WALLS[k].cut = H; WALLS[k].target = H; WALLS[k].built = -1;
  clip[k] = new THREE.Plane(new V3(0, -1, 0), H);
}
clip.back = new THREE.Plane(new V3(0, -1, 0), H);
const clipCache = new Map();
function clipTo(root, key) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const swap = (m) => {
      const id = m.uuid + key;
      if (!clipCache.has(id)) { const c = m.clone(); c.clippingPlanes = [clip[key]]; clipCache.set(id, c); }
      return clipCache.get(id);
    };
    o.material = Array.isArray(o.material) ? o.material.map(swap) : swap(o.material);
  });
}

/* ===================================================================

function wallRects(w) {
  const [a, b] = w.span;
  if (!w.hole) return [[a, b, 0, H]];
  const h = w.hole;
  return [[a, h.u0, 0, H], [h.u1, b, 0, H], [h.u0, h.u1, 0, h.y0], [h.u0, h.u1, h.y1, H]];
}
function wallBox(w, r, top, mats) {
  const [u0, u1, y0] = r;
  const hh = top - y0, du = u1 - u0, uc = (u0 + u1) / 2, yc = (y0 + top) / 2;
  const geo = w.axis === 'x' ? new THREE.BoxGeometry(T, hh, du) : new THREE.BoxGeometry(du, hh, T);
  const m = new THREE.Mesh(geo, mats);
  if (w.axis === 'x') m.position.set(w.pos + w.out * T / 2, yc, uc);
  else m.position.set(uc, yc, w.pos + w.out * T / 2);
  return m;
}
const wallGroups = {};
for (const k of WALL_KEYS) { wallGroups[k] = new THREE.Group(); scene.add(wallGroups[k]); }
function buildWall(k) {
  const w = WALLS[k], g = wallGroups[k];
  for (const c of [...g.children]) { c.geometry.dispose(); g.remove(c); }
  for (const r of wallRects(w)) {
    const top = Math.min(r[3], w.cut);
    if (top - r[2] < 0.004) continue;
    const cap = top < r[3] - 0.001 ? hatch : M.wallTop;
    const m = wallBox(w, r, top, [M.wall, M.wall, cap, M.wall, M.wall, M.wall]);
    m.receiveShadow = true;
    g.add(m);
  }
  w.built = w.cut;
}

/* --- plants --- */
function leafShape(slits) {
  const s = new THREE.Shape();
  const N = 28, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    let w = 0.5 * Math.sin(Math.PI * Math.pow(t, 0.75)) * (1 - 0.15 * t);
    if (t < 0.12) w += (0.12 - t) * 1.8; // heart lobes at the base
    pts.push([w, t]);
  }
  const right = [];
  for (let i = 0; i < pts.length; i++) {
    const [w, t] = pts[i];
    right.push([w, t]);
    if (slits && i % 6 === 3 && t > 0.2 && t < 0.85) right.push([w * 0.4, t + 0.025]);
  }
  s.moveTo(0, 0.06);
  for (const [w, t] of right) s.lineTo(w, t);
  for (let i = right.length - 1; i >= 0; i--) s.lineTo(-right[i][0], right[i][1]);
  s.lineTo(0, 0.06);
  return s;
}
const heartLeafGeo = new THREE.ShapeGeometry(leafShape(false), 2);

/* Painted leaves: a colour texture and a cut-out mask drawn from the same
   path, so the fenestrations and splits are real holes the ink pass sees. */
function paintLeaf(kind, seed) {
  const S = 512, r = rng(seed);
  const col = document.createElement('canvas'), msk = document.createElement('canvas');
  col.width = col.height = msk.width = msk.height = S;
  const g = col.getContext('2d'), m = msk.getContext('2d');
  const base = [S / 2, S - 14], tipY = 18;
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    let w = (kind === 'monstera' ? 0.47 : 0.4) * S * Math.sin(Math.PI * Math.pow(t, 0.78)) * (1 - 0.25 * t);
    if (t < 0.14) w += (0.14 - t) * S * (kind === 'monstera' ? 1.5 : 1.1);
    pts.push([w, base[1] - t * (base[1] - tipY)]);
  }
  const outline = (ctx) => {
    ctx.beginPath();
    ctx.moveTo(base[0], base[1] - 30);
    for (const [w, y] of pts) ctx.lineTo(base[0] + w, y);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(base[0] - pts[i][0], pts[i][1]);
    ctx.closePath();
  };
  // colour
  const grad = g.createLinearGradient(0, S, S, 0);
  if (kind === 'monstera') { grad.addColorStop(0, '#3f7c43'); grad.addColorStop(1, '#6caa5c'); }
  else { grad.addColorStop(0, '#4c8f45'); grad.addColorStop(1, '#8cc06a'); }
  outline(g); g.fillStyle = grad; g.fill();
  if (kind === 'pothos') {
    // golden variegation streaks
    g.save(); outline(g); g.clip();
    for (let i = 0; i < 7; i++) {
      g.strokeStyle = `rgba(236, 222, 140, ${0.25 + r() * 0.3})`; g.lineWidth = 6 + r() * 14;
      g.beginPath(); const x = base[0] + (r() - 0.5) * 200; g.moveTo(x, S); g.quadraticCurveTo(x + (r() - 0.5) * 120, S * 0.5, base[0] + (r() - 0.5) * 60, tipY); g.stroke();
    }
    g.restore();
  }
  // midrib and veins
  g.strokeStyle = 'rgba(214, 236, 170, 0.75)'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(base[0], base[1] - 10); g.quadraticCurveTo(base[0] + 8, S * 0.5, base[0], tipY + 12); g.stroke();
  g.lineWidth = 3; g.strokeStyle = 'rgba(214, 236, 170, 0.45)';
  const splits = kind === 'monstera' ? [0.26, 0.4, 0.54, 0.67, 0.79] : [];
  const veinTs = kind === 'monstera' ? [0.2, 0.33, 0.47, 0.6, 0.73, 0.85] : [0.25, 0.45, 0.65];
  for (const side of [-1, 1]) for (const t of veinTs) {
    const [w, y] = pts[Math.round(t * 40)];

function updateSun(h) {
  const rise = 6.5, set = 20.5;
  const f = (h - rise) / (set - rise);
  const el = Math.max(-20 * DEG, Math.sin(Math.PI * f) * 55 * DEG);
  const az = clamp(-70 + 140 * f, -80, 80) * DEG;
  sun.el = el;
  sun.dir.set(-Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).normalize();
  sun.day = smooth(-2 * DEG, 8 * DEG, el);
  sun.warm = 1 - smooth(8 * DEG, 35 * DEG, el);
  sun.night = 1 - smooth(-8 * DEG, 3 * DEG, el);
}

function updateBeam() {
  const pos = beamGeo.attributes.position;
  const D = sun.dir.clone().negate();
  const top = Math.min(WIN.y1, WALLS.W.cut);
  const corners = [[WIN.y0, WIN.u0], [WIN.y0, WIN.u1], [top, WIN.u1], [top, WIN.u0]];
  corners.forEach(([y, z], i) => {
    const c = new V3(-HW, y, z);
    let t = 12;
    if (D.y < -1e-4) t = Math.min(t, -c.y / D.y);
    if (D.x > 1e-4) t = Math.min(t, (HW - c.x) / D.x);
    if (D.z > 1e-4) t = Math.min(t, (HW - c.z) / D.z);
    if (D.z < -1e-4) t = Math.min(t, (-HW - c.z) / D.z);
    pos.setXYZ(i, c.x, c.y, c.z);
    pos.setXYZ(i + 4, c.x + D.x * t, c.y + D.y * t, c.z + D.z * t);
  });
  pos.needsUpdate = true;
  beamGeo.computeBoundingSphere();
  const patch = new V3();
  for (let i = 4; i < 8; i++) patch.add(new V3().fromBufferAttribute(pos, i));
  patch.multiplyScalar(0.25);
  patch.x = clamp(patch.x, -HW + 0.3, HW - 0.3); patch.z = clamp(patch.z, -HW + 0.3, HW - 0.3);
  patch.y = 0.35;
  bounce.position.copy(patch);

/* ---------- where is warm, and how to get there ---------- */
const CELL = 0.25, GN = Math.round((2 * HW) / CELL);

function rebuildGrid() {
  blocked = new Uint8Array(GN * GN);
  const boxes = [];
  for (const it of items) if (it.blocks && (it.kind === 'floor' || it === seatItem)) boxes.push(footprint(it));
  for (let i = 0; i < GN; i++) for (let j = 0; j < GN; j++) {
    const x = cellCenter(i), z = cellCenter(j);
    for (const b of boxes) if (x > b.x0 - 0.07 && x < b.x1 + 0.07 && z > b.z0 - 0.07 && z < b.z1 + 0.07) { blocked[i * GN + j] = 1; break; }

function findPath(from, to) {
  const si = cellOf(from.x), sj = cellOf(from.z), ti = cellOf(to.x), tj = cellOf(to.z);
  const start = si * GN + sj, goal = ti * GN + tj;
  if (blocked[goal]) return null;
  const g = new Float32Array(GN * GN).fill(Infinity), prev = new Int32Array(GN * GN).fill(-1), done = new Uint8Array(GN * GN);
  g[start] = 0;

  const hf = (n) => Math.hypot(Math.floor(n / GN) - ti, (n % GN) - tj);
  while (open.length) {
    let bi = 0;
    for (let k = 1; k < open.length; k++) if (g[open[k]] + hf(open[k]) < g[open[bi]] + hf(open[bi])) bi = k;
    const n = open.splice(bi, 1)[0];

    if (done[n]) continue;
    done[n] = 1;
    const ni = Math.floor(n / GN), nj = n % GN;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {

function warmth(p, onSeat) {
  let w = sunlit(new V3(p.x, p.y + 0.12, p.z)) * 3;
  if (weather.k > 0.5 && windowState.open) w -= 2 * Math.max(0, 1 - Math.hypot(p.x - winCenter.x, p.z - winCenter.z) / 1.6);
  if (lantern.on) {
    const d = Math.hypot(p.x - lanternLight.position.x, p.z - lanternLight.position.z);
    w += 1.6 * Math.max(0, 1 - d / 1.7);

/* leaves the cat knocks off the monstera */
const fallen = [];

  brushCooldown = 6;

/* ---------- papers and the breeze ---------- */
const wind = { v: 0, gust: 0, next: 5 };

/* ---------- rain: streaks behind the window, drops on the glass, puddles ---------- */
const RAIN = 320;
const rainPos = new Float32Array(RAIN * 6), rainSeed = new Float32Array(RAIN * 3);
{
  const r = rng(12);
  for (let i = 0; i < RAIN; i++) rainSeed.set([-5.4 + r() * 3.0, r() * 5, -3 + r() * 5], i * 3);
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: '#e4ebf7', transparent: true, opacity: 0, depthWrite: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc });
const rainLines = noInk(new THREE.LineSegments(rainGeo, rainMat));
rainLines.frustumCulled = false;
rainLines.renderOrder = 4;
scene.add(rainLines);
function stepRain(dt, time) {
  const vis = weather.k > 0.02;
  rainLines.visible = vis;
  if (!vis) return;
  rainMat.opacity = 0.6 * weather.k;
  for (let i = 0; i < RAIN; i++) {
    const x = rainSeed[i * 3], z = rainSeed[i * 3 + 2];
    const y = 3.4 - ((rainSeed[i * 3 + 1] + time * 5.5) % 5);
    rainPos.set([x, y, z, x + 0.03, y - 0.22, z + 0.02], i * 6);
  }
  rainGeo.attributes.position.needsUpdate = true;
}
const puddleMat = new THREE.MeshBasicMaterial({ map: steamTex, color: '#7a9fd6', transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
const puddles = [
  [new V3(-1.8, SEAT.top + 0.056, -0.4), 0.55, 0.9],
  [new V3(-1.2, 0.007, -0.35), 0.6, 1.1],
].map(([pos, sx, sz]) => {
  const m = noInk(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), puddleMat));
  m.rotation.x = -Math.PI / 2; m.position.copy(pos); m.scale.set(sx, sz, 1);
  scene.add(m);
  return m;
});
function stepWet(dt) {
  const raining = weather.k > 0.5 && windowState.k > 0.5;
  weather.wet = clamp(weather.wet + (raining ? dt * 0.06 : -dt * 0.03), 0, 1);
  puddleMat.opacity = 0.85 * weather.wet;
  puddles.forEach((m, i) => { const g = 0.55 + 0.45 * weather.wet; m.scale.set((i ? 0.6 : 0.55) * g, (i ? 1.1 : 0.9) * g, 1); });
}
function blowPaper() {
  const p = papers.find((q) => q.state === 'desk');
  if (!p) return;
  const world = new V3(); p.mesh.getWorldPosition(world);
  const dWin = Math.hypot(world.x - winCenter.x, world.z - winCenter.z);
  if (dWin > 3.4) return;
  scene.attach(p.mesh);
  p.state = 'flying';
  p.t = 0;
  p.from = p.mesh.position.clone();
  const away = new V3(world.x - winCenter.x, 0, world.z - winCenter.z).normalize();
  let to = world.clone().addScaledVector(away, 0.5 + Math.random() * 0.6);
  to.x = clamp(to.x + (Math.random() - 0.5) * 0.5, -HW + 0.25, HW - 0.25);
  to.z = clamp(to.z + (Math.random() - 0.5) * 0.5, -HW + 0.25, HW - 0.25);
  to.y = 0.004 + papers.filter((q) => q.state === 'floor').length * 0.001;
  p.to = to;
  p.spin = (Math.random() - 0.5) * 5;
  p.fromRot = p.mesh.rotation.z;
}
function tidyPaper(p) {
  p.state = 'return';
  p.t = 0;
  p.from = p.mesh.position.clone();
  p.fromRot = p.mesh.rotation.z;
}
function stepPapers(dt, time) {
  for (const p of papers) {
    if (p.state === 'flying') {
      p.t += dt / 1.6;
      const t = Math.min(1, p.t);
      p.mesh.position.lerpVectors(p.from, p.to, t);
      p.mesh.position.y = lerp(p.from.y, p.to.y, t) + Math.sin(Math.PI * t) * 0.45;
      p.mesh.rotation.x = -Math.PI / 2 + Math.sin(t * 9) * 0.5 * (1 - t);
      p.mesh.rotation.z = p.fromRot + p.spin * t;
      if (t >= 1) { p.state = 'floor'; p.mesh.rotation.x = -Math.PI / 2; }
    } else if (p.state === 'return') {
      p.t += dt / 0.8;
      const t = Math.min(1, p.t);
      const home = deskItem.group.localToWorld(new V3(p.home.x, p.home.y, p.home.z));
      p.mesh.position.lerpVectors(p.from, home, t);
      p.mesh.position.y += Math.sin(Math.PI * t) * 0.3;
      if (t >= 1) {
        deskItem.group.attach(p.mesh);
        p.mesh.position.set(p.home.x, p.home.y, p.home.z);
        p.mesh.rotation.set(-Math.PI / 2, 0, p.home.ry);
        p.state = 'desk';
      }
    } else if (p.state === 'desk' && wind.v > 0.3) {
      p.mesh.rotation.x = -Math.PI / 2 + Math.max(0, Math.sin(time * 9 + p.home.x * 30)) * 0.05 * wind.v;
    }
  }
}

/* ===================================================================
   PAINT PIPELINE
   1. colour  (MSAA, HDR half-float, stencil for the window portal)
   2. normals + depth  (same scene, normal materials, clip planes kept)
   3. bloom   (bright pass at quarter size, two separable blurs)
   4. paint   ink edges, ambient occlusion, bloom, grade, paper, tilt-shift
   =================================================================== */
const HF = THREE.HalfFloatType;
const colorRT = new THREE.WebGLRenderTarget(1, 1, { type: HF, samples: 4, stencilBuffer: true });
const normalRT = new THREE.WebGLRenderTarget(1, 1, { type: HF, depthTexture: new THREE.DepthTexture(1, 1) });
const bloomA = new THREE.WebGLRenderTarget(1, 1, { type: HF });
const bloomB = new THREE.WebGLRenderTarget(1, 1, { type: HF });
const quadVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
fsQuad.frustumCulled = false;
const fsScene = new THREE.Scene();
fsScene.add(fsQuad);
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
function runPass(mat, target) { fsQuad.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: colorRT.texture }, uThreshold: { value: 1.5 } },
  vertexShader: quadVS,
  fragmentShader: `uniform sampler2D tColor; uniform float uThreshold; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tColor, vUv).rgb; float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      gl_FragColor = vec4(c * smoothstep(uThreshold, uThreshold + 0.9, l), 1.0); }`,
  depthTest: false, depthWrite: false,
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } },
  vertexShader: quadVS,
  fragmentShader: `uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tSrc, vUv).rgb * 0.2270;
      c += (texture2D(tSrc, vUv + uDir * 1.3846).rgb + texture2D(tSrc, vUv - uDir * 1.3846).rgb) * 0.3162;
      c += (texture2D(tSrc, vUv + uDir * 3.2308).rgb + texture2D(tSrc, vUv - uDir * 3.2308).rgb) * 0.0703;
      gl_FragColor = vec4(c, 1.0); }`,
  depthTest: false, depthWrite: false,
});

const paintMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: colorRT.texture }, tNormal: { value: normalRT.texture }, tDepth: { value: normalRT.depthTexture },
    tBloom: { value: bloomA.texture },
    uTexel: { value: new THREE.Vector2() }, uNear: { value: 0.1 }, uFar: { value: 100 },
    uFrustum: { value: new THREE.Vector4() }, uInk: { value: new THREE.Color('#4a323c') },
    uNight: { value: 0 }, uTilt: { value: 0 }, uFocus: { value: 0.45 }, uAO: { value: 1 },
    uSkyTop: { value: new THREE.Color('#bcd7ee') }, uSkyBottom: { value: new THREE.Color('#f1e9e2') },
  },
  vertexShader: quadVS,
  fragmentShader: `
    uniform sampler2D tColor, tNormal, tDepth, tBloom;
    uniform vec2 uTexel; uniform float uNear, uFar, uNight, uTilt, uFocus, uAO;
    uniform vec4 uFrustum; uniform vec3 uInk, uSkyTop, uSkyBottom;
    varying vec2 vUv;
    float D(vec2 uv){ return texture2D(tDepth, uv).x; }
    vec3 N(vec2 uv){ return normalize(texture2D(tNormal, uv).xyz * 2.0 - 1.0); }
    vec3 P(vec2 uv){ return vec3(mix(uFrustum.x, uFrustum.y, uv.x), mix(uFrustum.z, uFrustum.w, uv.y), -(uNear + D(uv) * (uFar - uNear))); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }

    void main(){
      // tilt-shift: soft focus away from a horizontal band, like a macro lens on a miniature
      float blurAmt = uTilt * smoothstep(0.08, 0.42, abs(vUv.y - uFocus));
      vec4 col = texture2D(tColor, vUv);
      if (blurAmt > 0.001) {
        vec4 acc = col; float wsum = 1.0;
        for (int i = 0; i < 16; i++) {
          float a = float(i) * 2.39996, r = sqrt((float(i) + 0.5) / 16.0);
          vec2 o = vec2(cos(a), sin(a)) * r * blurAmt * 9.0 * uTexel;
          acc += texture2D(tColor, vUv + o); wsum += 1.0;
        }
        col = acc / wsum;
      }
      float dc = D(vUv);
      float edge = 0.0, ao = 0.0;
      if (dc < 0.9999) {
        vec2 t = uTexel;
        float lap = abs(D(vUv - vec2(t.x, 0)) + D(vUv + vec2(t.x, 0)) - 2.0 * dc)
                  + abs(D(vUv - vec2(0, t.y)) + D(vUv + vec2(0, t.y)) - 2.0 * dc)
                  + 0.5 * abs(D(vUv - t) + D(vUv + t) - 2.0 * dc)
                  + 0.5 * abs(D(vUv + vec2(-t.x, t.y)) + D(vUv + vec2(t.x, -t.y)) - 2.0 * dc);
        float dEdge = smoothstep(0.012, 0.035, lap * (uFar - uNear));
        vec3 nc = N(vUv);
        float nd = max(max(1.0 - dot(nc, N(vUv + vec2(t.x, 0))), 1.0 - dot(nc, N(vUv - vec2(t.x, 0)))),
                       max(1.0 - dot(nc, N(vUv + vec2(0, t.y))), 1.0 - dot(nc, N(vUv - vec2(0, t.y)))));
        float nEdge = smoothstep(0.22, 0.5, nd);
        edge = max(dEdge, nEdge) * (0.75 + 0.25 * vnoise(gl_FragCoord.xy * 0.08)) * (1.0 - blurAmt);

        // ambient occlusion in the orthographic view: a spiral of samples within 22 cm
        vec3 p = P(vUv);
        vec2 span = vec2(uFrustum.y - uFrustum.x, uFrustum.w - uFrustum.z);
        float rot = hash(gl_FragCoord.xy) * 6.2831;
        for (int i = 0; i < 12; i++) {
          float a = float(i) * 2.39996 + rot, r = (float(i) + 0.5) / 12.0;
          vec2 o = vec2(cos(a), sin(a)) * r * 0.22;
          vec3 q = P(vUv + o / span) - p;
          float dist = length(q);
          ao += max(0.0, dot(nc, q / max(dist, 1e-4)) - 0.12) * (1.0 - smoothstep(0.08, 0.32, dist));
        }
        ao = clamp(ao / 12.0 * 2.2, 0.0, 1.0) * uAO;
      }
      vec3 c = col.rgb;
      c *= mix(vec3(1.0), vec3(0.8, 0.74, 0.9), ao);
      c = mix(c, c * uInk * 1.9, edge * 0.85);
      // bloom, warmed a touch
      vec3 bl = texture2D(tBloom, vUv).rgb;
      c += bl * vec3(1.0, 0.9, 0.78) * 0.55;
      float alpha = max(col.a, clamp(dot(bl, vec3(0.33)) * 0.6, 0.0, 1.0));
      // the sky is part of the picture, so saved stills and videos keep it
      c += mix(uSkyBottom, uSkyTop, vUv.y) * (1.0 - alpha);
      alpha = 1.0;
      // grade: lavender in the shade, apricot in the light
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722)) / max(alpha, 0.001);
      vec3 shade = mix(vec3(0.94, 0.9, 1.06), vec3(0.9, 0.9, 1.1), uNight);
      c *= mix(shade, vec3(1.05, 1.0, 0.93), smoothstep(0.08, 0.7, lum));
      // paper: fine grain and slow fibres
      float grain = hash(gl_FragCoord.xy + 17.0) - 0.5;
      float fibre = vnoise(gl_FragCoord.xy * vec2(0.012, 0.03)) - 0.5;
      c *= 1.0 + grain * 0.045 + fibre * 0.05;
      gl_FragColor = vec4(c, alpha);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});

const normalMats = new Map();
/* view-space normals for cut-out leaves: MeshNormalMaterial ignores masks */
function cutNormalMat(mask, side, planes) {
  return new THREE.ShaderMaterial({
    uniforms: { tA: { value: mask } }, side, clipping: !!planes, clippingPlanes: planes,
    vertexShader: `
      #include <clipping_planes_pars_vertex>
      varying vec3 vN; varying vec2 vUv;
      void main(){
        vUv = uv; vN = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        #include <clipping_planes_vertex>
      }`,
    fragmentShader: `
      #include <clipping_planes_pars_fragment>
      uniform sampler2D tA; varying vec3 vN; varying vec2 vUv;
      void main(){
        #include <clipping_planes_fragment>
        if (texture2D(tA, vUv).g < 0.5) discard;
        vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
        gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
      }`,
  });
}
function normalMatFor(m) {
  const src = Array.isArray(m) ? m[0] : m;
  const planes = src.clippingPlanes || null;
  const cut = src.alphaTest > 0 ? src.alphaMap || src.map : null;
  const key = (planes ? planes[0].__id || (planes[0].__id = Math.random()) : 0) + ':' + src.side + ':' + (cut ? cut.uuid : '');
  if (!normalMats.has(key)) normalMats.set(key, cut ? cutNormalMat(cut, src.side, planes) : new THREE.MeshNormalMaterial({ side: src.side, clippingPlanes: planes }));
  return normalMats.get(key);
}
function sizeTargets() {
  const v = renderer.getDrawingBufferSize(new THREE.Vector2());
  colorRT.setSize(v.x, v.y);
  normalRT.setSize(v.x, v.y);
  const bw = Math.max(1, Math.round(v.x / 4)), bh = Math.max(1, Math.round(v.y / 4));
  bloomA.setSize(bw, bh); bloomB.setSize(bw, bh);
  blurMat.userData.texel = new THREE.Vector2(1 / bw, 1 / bh);
  const px = Math.max(1, renderer.getPixelRatio() * 0.8);
  paintMat.uniforms.uTexel.value.set(px / v.x, px / v.y);
}
const swapped = [];
const look = { tilt: 0, tiltTarget: 0, focus: 0.45 };
function renderFrame() {
  const u = paintMat.uniforms;
  u.uNear.value = camera.near; u.uFar.value = camera.far;
  u.uFrustum.value.set(camera.left / camera.zoom, camera.right / camera.zoom, camera.bottom / camera.zoom, camera.top / camera.zoom);
  u.uNight.value = sun.night || 0;
  u.uTilt.value = look.tilt;
  u.uFocus.value = look.focus;

  renderer.setRenderTarget(colorRT);
  renderer.clear();
  renderer.render(scene, camera);

  camera.layers.set(0);
  scene.traverseVisible((o) => { if (o.isMesh && o.layers.test(camera.layers)) { swapped.push(o, o.material); o.material = normalMatFor(o.material); } });
  renderer.setRenderTarget(normalRT);
  renderer.setClearColor(0x808080, 0);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setClearColor(0x000000, 0);
  for (let i = 0; i < swapped.length; i += 2) swapped[i].material = swapped[i + 1];
  swapped.length = 0;
  camera.layers.enable(1);

  runPass(brightMat, bloomA);
  const tx = blurMat.userData.texel;
  for (let i = 0; i < 2; i++) {
    blurMat.uniforms.tSrc.value = bloomA.texture; blurMat.uniforms.uDir.value.set(tx.x * (1 + i), 0); runPass(blurMat, bloomB);
    blurMat.uniforms.tSrc.value = bloomB.texture; blurMat.uniforms.uDir.value.set(0, tx.y * (1 + i)); runPass(blurMat, bloomA);
  }
  runPass(paintMat, null);
}

/* ===================================================================
   CAMERA: orthographic, turns in quarter steps.
   =================================================================== */
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.layers.enable(1);
sunLight.shadow.camera.layers.enable(1);
const view = { angle: (45 + 90 * num('rot', 0)) * DEG, target: (45 + 90 * num('rot', 0)) * DEG, zoom: num('zoom', 1), center: new V3(0, 0.95, 0) };
function placeCamera() {
  const r = 20, el = 30 * DEG;
  camera.position.set(Math.cos(view.angle) * Math.cos(el) * r, Math.sin(el) * r, Math.sin(view.angle) * Math.cos(el) * r).add(view.center);
  camera.lookAt(view.center);
  fill.position.copy(camera.position);
}
function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  sizeTargets();
  let half = Math.max(3.05, 3.55 / aspect);
  if (w < 720) half = Math.max(3.3, 3.2 / aspect);
  half /= view.zoom;
  camera.left = -half * aspect; camera.right = half * aspect;
  camera.top = half * 1.02; camera.bottom = -half * 0.98;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function isNear(k) {
  const cx = Math.cos(view.angle), cz = Math.sin(view.angle);
  const o = { W: [-1, 0], E: [1, 0], N: [0, -1], S: [0, 1] }[k];
  return cx * o[0] + cz * o[1] > 0.05;
}
let backCut = num('cut', H);
function updateWalls(dt) {
  for (const k of WALL_KEYS) {
    const w = WALLS[k];
    w.target = isNear(k) ? NEAR_CUT : backCut;
    w.cut = lerp(w.cut, w.target, dt < 0 ? 1 : damp(dt, 9));
    if (Math.abs(w.cut - w.target) < 0.002) w.cut = w.target;
    if (Math.abs(w.cut - w.built) > 0.0005) buildWall(k);
    clip[k].constant = w.cut + 0.001;
  }
  clip.back.constant = Math.min(...WALL_KEYS.filter((k) => !isNear(k)).map((k) => WALLS[k].cut)) + 0.001;
}

/* ===================================================================
   INPUT: hover, click, drag, turn.
   =================================================================== */
const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tip = $('tip');
let hover = null, drag = null, down = null;

function pick(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  for (const h of hits) {
    const o = h.object;
    if (!o.visible) continue;
    let vis = true;
    o.traverseAncestors((a) => { if (!a.visible) vis = false; });
    if (!vis) continue;
    const planes = (Array.isArray(o.material) ? o.material[0] : o.material).clippingPlanes;
    if (planes && planes.some((pl) => pl.distanceToPoint(h.point) < 0)) continue;
    return { hit: h, item: o.userData.item, part: o.userData.part };
  }
  return null;
}
function planeHit(e, plane) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const p = new V3();
  return ray.ray.intersectPlane(plane, p) ? p : null;
}
function overlaps(it, x, z, rot) {
  const f = footprint({ ...it, x, z, rot });
  if (f.x0 < -HW - 1e-3 || f.x1 > HW + 1e-3 || f.z0 < -HW - 1e-3 || f.z1 > HW + 1e-3) return true;
  if (!it.blocks) return false;
  for (const o of items) {
    if (o === it || !o.blocks || !(o.kind === 'floor' || o === seatItem)) continue;
    const g = footprint(o);
    if (f.x0 < g.x1 - 1e-3 && f.x1 > g.x0 + 1e-3 && f.z0 < g.z1 - 1e-3 && f.z1 > g.z0 + 1e-3) return true;
  }
  return false;
}
function placeItem(it) {
  it.group.position.x = it.x; it.group.position.z = it.z;
  it.group.rotation.y = -it.rot * Math.PI / 2;
}
function turnItem(it) {
  if (!it || it.kind !== 'floor') return;
  const rot = (it.rot + 1) % 4;
  const f = footprint({ ...it, rot });
  const x = clamp(it.x, -HW + f.w / 2, HW - f.w / 2), z = clamp(it.z, -HW + f.d / 2, HW - f.d / 2);
  if (overlaps(it, x, z, rot)) return;
  Object.assign(it, { rot, x, z });
  placeItem(it);
  itemsMoved();
}
function itemsMoved() { rebuildGrid(); cat.decideT = Math.min(cat.decideT, 0.4); }

const snap = (v) => Math.round(v / 0.05) * 0.05;
canvas.addEventListener('pointerdown', (e) => {
  canvas.focus();
  if (photo.on) { look.focus = clamp(1 - e.clientY / innerHeight, 0.1, 0.9); return; }
  const p = pick(e);
  down = { x: e.clientX, y: e.clientY, p };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (photo.on) return;
  if (down && !drag && down.p && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) {
    const it = down.p.item;
    if (it && (it.kind === 'floor' || it.kind === 'wall' || it.kind === 'cat')) {
      if (it.kind === 'cat') { cat.held = true; cat.path = []; }
      const plane = it.kind === 'wall' ? new THREE.Plane(new V3(0, 0, 1), HW - 0.013) : new THREE.Plane(new V3(0, 1, 0), 0);
      const start = planeHit(e, plane);
      if (start) drag = { it, plane, off: it.kind === 'wall' ? new V3(it.group.position.x - start.x, it.group.position.y - start.y, 0) : new V3(it.x - start.x, 0, it.z - start.z) };
    }
  }
  if (drag) {
    const hit = planeHit(e, drag.plane);
    if (hit) {

function buildRadio() {

  const music = ctx.createGain();

const skyKeys = [
  { el: -20, top: '#1e1c38', bottom: '#3a3363' },

  { el: 2, top: '#8f86c4', bottom: '#f3b99a' },

  { el: 40, top: '#bcd7ee', bottom: '#f1e9e2' },

const cA = new THREE.Color(), cB = new THREE.Color();
function skyColors() {
  const e = sun.el / DEG;
  let i = 0;
  while (i < skyKeys.length - 2 && e > skyKeys[i + 1].el) i++;
  const a = skyKeys[i], b = skyKeys[i + 1];
  const t = clamp((e - a.el) / (b.el - a.el), 0, 1);
  const top = cA.set(a.top).lerp(cB.set(b.top), t).getHexString();
  const bottom = cA.set(a.bottom).lerp(cB.set(b.bottom), t).getHexString();
  cA.set(`#${top}`).lerp(cB.set('#8e93a8'), weather.k * 0.65); const t2 = cA.getHexString();
  cA.set(`#${bottom}`).lerp(cB.set('#c4c3cd'), weather.k * 0.65); const b2 = cA.getHexString();
  return [`#${t2}`, `#${b2}`];
}

const sunWarm = new THREE.Color('#ffb46e'), sunNoon = new THREE.Color('#fff4de');
const hemiDaySky = new THREE.Color('#f3ecff'), hemiNightSky = new THREE.Color('#7a74b8');
const hemiDayGround = new THREE.Color('#e8d3e6'), hemiNightGround = new THREE.Color('#4a4068');

let last = performance.now(), time = 0, grownLast = -1;

const SPEED = num('speed', 1 / 45);

updateWalls(-1);

function frame(now) {

      u.rotation.z = Math.sin(time * 1.3 + i) * 0.015 * (1 + wind.v * 3);
    });
    lemon.lit = sunlit(new V3(lemonItem.x, 0.85, lemonItem.z));
    if (lemon.lit) lemon.growth = Math.min(1, lemon.growth + dt * 0.004);
    const n = lemonCount();
    lemon.fruit.forEach((f, i) => f.scale.setScalar(lerp(f.scale.x, i < n ? 1 : 0.001, damp(dt, 2))));
    for (const p of pothos) {
      p.lit = sunlit(new V3(p.x, p.y - 0.2, p.z + 0.1));
      if (p.lit) p.growth = Math.min(1, p.growth + dt * 0.004);
      p.vines.forEach((v) => {
        const n = Math.round(4 + p.growth * (v.max - 4));
        v.leaves.forEach((lf, i) => {
          const s = i / (v.max - 1);
          const drop = i * 0.055;
          lf.position.set(p.x + v.dx * (1 + s) + Math.sin(time * 0.9 + lf.userData.sway) * 0.006 * s * (1 + wind.v * 4), p.y - 0.03 - drop, p.z + v.dz * 0.4 + Math.min(0.1, s * 0.06));
          lf.rotation.set(-0.3 + Math.sin(i * 1.7) * 0.4, lf.userData.ry, Math.PI + Math.sin(i * 2.3) * 0.6);
          const tgt = i < n ? lf.userData.s : 0.001;
          lf.scale.setScalar(lerp(lf.scale.x, tgt, damp(dt, 2)));
        });
      });
    }
  }

  // books lean into gaps
  for (const b of books) {
    b.pull += ((b.out ? 1 : 0) - b.pull) * damp(dt, 8);
    b.lean += (b.leanT - b.lean) * damp(dt, 6);
    const a = b.lean * 0.2;
    // lean about the bottom corner nearest the gap
    b.pivot.rotation.z = a;
    b.pivot.position.x = b.x + (a < 0 ? (b.w / 2) * (1 - Math.cos(a)) : 0) - Math.sin(-a) * 0;
    b.pivot.position.z = 0.02 + b.pull * 0.13;
    b.pivot.position.y = b.y + b.pull * 0.004;
    b.mesh.rotation.x = -b.pull * 0.12;
  }

  // leaves falling
  brushCooldown -= dt;
  for (const f of fallen) {
    if (f.t >= 1) continue;
    f.t = Math.min(1, f.t + dt / 2.2);
    f.mesh.position.lerpVectors(f.from, f.to, f.t);
    f.mesh.position.x += Math.sin(f.t * 10) * 0.08 * (1 - f.t);
    f.mesh.rotation.set(-Math.PI / 2 + Math.sin(f.t * 12) * 0.6 * (1 - f.t), 0, f.spin * f.t);
  }

  stepPapers(dt, time);
  stepCat(dt, time);
  stepRecording(dt);
  stepAudio();
  stepRain(dt, time);
  stepWet(dt);
  autosave(dt);
  poseCat(dt, time);

  renderFrame();
  window.__room.frames++;
  if (!FIXED) requestAnimationFrame(frame);
}

window.__room = {
  frames: 0, cat, clock, items, view, resize, camera, radio, sunlit, lantern, windowState, monstera, lemon, papers, tea,
  get: (name) => items.find((i) => i.name === name),
  move(name, x, z, rot = 0) { const it = this.get(name); Object.assign(it, { x, z, rot }); placeItem(it); itemsMoved(); },
  project(v) { const p = new V3(...v).project(camera); return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]; },
};
window.__room.tick = (n = 1) => { for (let i = 0; i < n; i++) frame(last + 1000 / 30); };
if (FIXED) { last = 0; window.__room.tick(2); } else requestAnimationFrame(frame);
</script>
</body>
</html>
