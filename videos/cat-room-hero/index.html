<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fffaf3; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
      #root > video { z-index: 1; }
    </style>
  </head>
  <body>
    <!-- One continuous shot (film4.mjs + videos/hero/director.js): no cuts. Captions and the
         closing card are the only layers over it. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.8" data-width="1920" data-height="1080">
      <audio id="music-bed" class="clip" src="assets/music.mp3" data-start="0" data-duration="18.8" data-track-index="9000" data-volume="0.9"></audio>

      <video id="footage" src="assets/footage/hero.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="0" data-duration="18.8" data-track-index="1000"></video>

      <div id="el-captions" class="scene" data-composition-id="captions"
        data-composition-src="compositions/frames/captions.html"
        data-start="0" data-duration="13.2" data-track-index="0"></div>

      <div id="el-08-cta" class="scene" data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="13.2" data-duration="5.6" data-track-index="1"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13.2);
        tl.to({}, { duration: 18.8 }, 0); // full-span anchor
      })();
    </script>
  </body>
</html>
