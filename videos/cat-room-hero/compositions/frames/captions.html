<template>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-start="0" data-duration="13.2">
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2");
        font-style: italic;
        font-weight: 400 700;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; pointer-events: none; }
      /* one caption system for the whole film: cream cards, bottom centre, above the room's
         own controls; a second line always joins under the first */
      [class~="cap"] {
        position: absolute;
        left: 50%;
        padding: 18px 34px 22px;
        border-radius: 18px;
        background: rgba(255, 250, 243, 0.95);
        box-shadow: 0 14px 40px rgba(65, 56, 77, 0.2);
        font-family: "Fraunces", Georgia, serif;
        font-size: 64px;
        line-height: 1.08;
        letter-spacing: -0.014em;
        color: #41384d;
        white-space: nowrap;
        opacity: 0;
      }
      [class~="cap"][class~="upper"] { top: 736px; }
      [class~="cap"][class~="lower"] { top: 850px; }
      [class~="cap"] em { font-style: italic; color: #d97a3a; }
    </style>

    <div id="captions-layer" class="clip" data-start="0" data-duration="13.2" data-track-index="1"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        // [enter, exit, upper line or null, lower line]: times match the camera in videos/launch/director.js,
        // each caption lands while the camera holds and leaves before the next move gathers speed
        var CAPS = [
          [0.3, 3.3, null, "Built piece by <em>piece</em>."],
          [4.8, 8.5, null, "Drag things <em>in</em>."],
          [9.0, 12.0, null, "Scrub the <em>day</em>."],
        ];
        var layer = document.getElementById("captions-layer");
        var tl = gsap.timeline({ paused: true });
        var IN = { duration: 0.45, ease: "power3.out" }, OUT = { duration: 0.35, ease: "power2.in" };
        CAPS.forEach(function (c, k) {
          var a = c[0], b = c[1];
          var els = [];
          [[c[2], "upper"], [c[3], "lower"]].forEach(function (p, j) {
            if (!p[0]) return;
            var el = document.createElement("p");
            el.id = "cap-" + k + "-" + j;
            el.className = "cap " + p[1];
            el.innerHTML = p[0];
            layer.appendChild(el);
            els.push(el);
            gsap.set(el, { xPercent: -50 }); // centred on the frame; gsap owns the transform
            // a two-line caption: the answer joins 0.8 s after its question
            var at = c[2] && j === 1 ? a + 0.8 : a;
            tl.fromTo(el, { opacity: 0, y: 18 }, Object.assign({ opacity: 1, y: 0 }, IN), at);
          });
          tl.to(els, Object.assign({ opacity: 0, y: -10 }, OUT), b - OUT.duration);
        });
        tl.set({}, {}, 13.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>
