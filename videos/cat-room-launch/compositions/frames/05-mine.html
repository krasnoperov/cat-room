<template>
  <div id="root" data-composition-id="05-mine" data-width="1920" data-height="1080" data-start="0" data-duration="8">
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2"); font-style: normal; font-weight: 400; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      [class~="05-mine-caption-layer"] { position: absolute; inset: 0; container-type: size; pointer-events: none; }
      [class~="05-mine-veil"] {
        position: absolute; top: 4.2cqw; left: 4.2cqw;
        display: inline-block;
        padding: 1.1cqw 2.1cqw 1.5cqw 2.1cqw;
        border-radius: 12px;
        background: rgba(24, 22, 21, 0.52);
        border: 1px solid rgba(255, 250, 243, 0.14);
      }
      [class~="05-mine-slot"] {
        display: block; white-space: nowrap;
        font-family: "Fraunces", Georgia, serif; font-weight: 400;
        font-size: 7.3cqw; line-height: 1.02; letter-spacing: -0.022em;
        color: #FFFAF3;
      }
      [class~="05-mine-slot"][class~="05-mine-is-mine"] { font-style: italic; letter-spacing: -0.012em; color: #E0894A; }
    </style>

    <!-- Approved footage: three full-bleed sub-shots, hard-cut in sequence on one slot -->
    <!-- approved frame video hoisted by assemble-index -->
    <!-- approved frame video hoisted by assemble-index -->
    <!-- approved frame video hoisted by assemble-index -->

    <!-- Caption: upper-left, one slot that hard-cuts question -> "Mine." -->
    <div class="clip 05-mine-caption-layer" data-start="0" data-duration="8" data-track-index="1">
      <div class="05-mine-veil" id="05-mine-veil">
        <span class="05-mine-slot" id="05-mine-slot">A box?</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Discrete in-place token swap: each state holds from its t until the next.
        var SEQUENCE = [
          { t: 0.0, text: "A box?",       mine: false },
          { t: 1.4, text: "Mine.",        mine: true  },
          { t: 2.5, text: "Yarn?",        mine: false },
          { t: 3.9, text: "Mine.",        mine: true  },
          { t: 5.0, text: "The red dot?", mine: false },
          { t: 6.6, text: "Mine.",        mine: true  }
        ];
        function stateAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t - 1e-4) return SEQUENCE[i];
          }
          return SEQUENCE[0];
        }

        var slot = document.getElementById("05-mine-slot");
        var shown = null;
        function render(time) {
          var s = stateAt(time);
          if (s === shown) return;
          shown = s;
          slot.textContent = s.text;
          if (s.mine) slot.classList.add("05-mine-is-mine");
          else slot.classList.remove("05-mine-is-mine");
        }

        var driver = { t: 0 };
        render(0);
        tl.to(driver, {
          t: 7.5, duration: 7.5, ease: "none",
          onUpdate: function () { render(driver.t); }
        }, 0);

        window.__timelines["05-mine"] = tl;
      })();
    </script>
  </div>
