<template>
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2");
      font-style: italic;
      font-weight: 100 900;
    }
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }
    #hook01-veil {
      position: absolute;
      left: 80px;
      top: 104px;
      width: 760px;
      height: 460px;
      border-radius: 12px;
      background: rgba(255, 250, 243, 0.62);
      border: 1px solid rgba(65, 56, 77, 0.12);
      transform-origin: 50% 0%;
    }
    #hook01-copy {
      position: absolute;
      left: 128px;
      top: 140px;
      width: 680px;
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 4.6cqw;
      line-height: 1.1;
      letter-spacing: -0.012em;
      color: #41384d;
    }
    .hook01-line {
      display: block;
      white-space: nowrap;
    }
    .hook01-word {
      display: inline-block;
      will-change: transform, opacity, filter;
    }
    .hook01-coral {
      color: #e0894a;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
    <!-- approved frame video hoisted by assemble-index -->

    <div id="hook01-veil" class="clip" data-start="0" data-duration="4.5" data-track-index="1"></div>

    <div id="hook01-copy" class="clip" data-start="0" data-duration="4.5" data-track-index="2">
      <span class="hook01-line" id="hook01-l1"><span class="hook01-word">A</span> <span class="hook01-word">small</span> <span class="hook01-word">room.</span></span>
      <span class="hook01-line" id="hook01-l2"><span class="hook01-word">A</span> <span class="hook01-word">big</span> <span class="hook01-word">window.</span></span>
      <span class="hook01-line" id="hook01-l3a"><span class="hook01-word">And</span> <span class="hook01-word hook01-coral">someone</span></span>
      <span class="hook01-line" id="hook01-l3b"><span class="hook01-word">who</span> <span class="hook01-word">lives</span> <span class="hook01-word">here.</span></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (sel) => Array.from(document.querySelectorAll(sel));

      // Beat grid (dynamic-content-sequencing, pre-computed once): each line owns a window,
      // its words reveal per-word staggered on the window start; the last line holds to the cut.
      const BEATS = [
        { words: q("#hook01-l1 .hook01-word"), start: 0.15, veil: 0.38 },
        { words: q("#hook01-l2 .hook01-word"), start: 1.1, veil: 0.6 },
        { words: q("#hook01-l3a .hook01-word").concat(q("#hook01-l3b .hook01-word")), start: 2.2, veil: 1 },
      ];
      const WORD_DUR = 0.6;
      const STAGGER = 0.11;

      // Veil strip: fades in with the first line, then extends down as each line is added.
      tl.fromTo("#hook01-veil", { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: BEATS[0].veil, duration: 0.5, ease: "power2.out" }, 0);
      tl.to("#hook01-veil", { scaleY: BEATS[1].veil, duration: 0.45, ease: "power2.out" }, BEATS[1].start - 0.05);
      tl.to("#hook01-veil", { scaleY: BEATS[2].veil, duration: 0.5, ease: "power2.out" }, BEATS[2].start - 0.05);

      BEATS.forEach((beat) => {
        tl.fromTo(
          beat.words,
          { opacity: 0, y: 22, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: WORD_DUR, ease: "power3.out", stagger: STAGGER },
          beat.start,
        );
      });

      // Hold still to the cut (the heart rising in the footage is the payoff).
      tl.set({}, {}, 4);

      window.__timelines["01-hook"] = tl;
    })();
  </script>
