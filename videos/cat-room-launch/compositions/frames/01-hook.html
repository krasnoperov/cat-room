<template>
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2");
      font-style: italic;
      font-weight: 100 900;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* organic light leak (adapted from the organic-light-leak-overlay block): warm amber, screen blend */
    #hook01-leak {
      position: absolute;
      inset: -16%;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .hook01-leak-layer {
      position: absolute;
      inset: -20%;
    }
    #hook01-leak-amber {
      background:
        radial-gradient(ellipse 48% 90% at 12% 22%, rgba(255, 241, 197, 0.92), transparent 45%),
        radial-gradient(ellipse 70% 110% at 22% 30%, rgba(255, 150, 70, 0.72), transparent 66%);
      filter: blur(30px);
    }
    #hook01-leak-ember {
      background: radial-gradient(
        ellipse 52% 90% at 34% 18%,
        rgba(255, 128, 64, 0.5),
        rgba(255, 96, 60, 0.18) 48%,
        transparent 76%
      );
      filter: blur(43px);
    }
    #hook01-leak-gold {
      background: linear-gradient(
        124deg,
        transparent 18%,
        rgba(255, 150, 62, 0.28) 32%,
        rgba(255, 247, 205, 0.66) 42%,
        rgba(255, 130, 48, 0.2) 52%,
        transparent 68%
      );
      filter: blur(22px);
    }

    /* caption, upper-right third, clear of the cat's head */
    #hook01-caption {
      position: absolute;
      left: 960px;
      top: 150px;
      width: 920px;
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 78px;
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: #41384d;
      text-shadow:
        0 0 2px rgba(255, 250, 243, 0.9),
        0 0 22px rgba(255, 250, 243, 0.85),
        0 0 48px rgba(255, 250, 243, 0.6);
    }
    #hook01-text {
      display: inline-block;
    }
    .hook01-coral {
      color: #e0894a;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
    <!-- approved frame video hoisted by assemble-index -->

    <div id="hook01-leak" class="clip" data-start="0" data-duration="1.8" data-track-index="1" aria-hidden="true">
      <div id="hook01-leak-amber" class="hook01-leak-layer"></div>
      <div id="hook01-leak-ember" class="hook01-leak-layer"></div>
      <div id="hook01-leak-gold" class="hook01-leak-layer"></div>
    </div>

    <p id="hook01-caption" class="clip" data-start="0" data-duration="4.5" data-track-index="2">
      <span id="hook01-text">shh.</span>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="01-hook"]');
      const one = (sel) => root.querySelector(sel);
      const tl = gsap.timeline({ paused: true });

      const leak = one("#hook01-leak");
      const caption = one("#hook01-caption");
      const textEl = one("#hook01-text");

      // Scene 1 (0.0–1.6s): warm light leak drifts in from the upper-left, peaks low, gone by 1.6s
      tl.fromTo(leak, { opacity: 0 }, { opacity: 0.35, duration: 0.55, ease: "power3.out" }, 0.05);
      tl.fromTo(
        leak,
        { opacity: 0.35 },
        { opacity: 0, duration: 0.7, ease: "power3.in", immediateRender: false },
        0.9
      );
      tl.fromTo(
        one("#hook01-leak-amber"),
        { xPercent: -14, yPercent: -6, scale: 0.94, rotation: -4 },
        { xPercent: 10, yPercent: 4, scale: 1.08, rotation: 2, duration: 1.6, ease: "power3.out" },
        0
      );
      tl.fromTo(
        one("#hook01-leak-ember"),
        { xPercent: -10, yPercent: -10, scale: 1.06 },
        { xPercent: 12, yPercent: 6, scale: 0.96, duration: 1.6, ease: "power3.out" },
        0
      );
      tl.fromTo(
        one("#hook01-leak-gold"),
        { xPercent: -24, rotation: -6 },
        { xPercent: 18, rotation: 3, duration: 1.6, ease: "power3.out" },
        0
      );

      // Scene 2 (0.9–2.2s): "shh." fades in beside the cat's head
      tl.fromTo(
        caption,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.9
      );

      // Scene 3 (2.2s): hard-cut word swap in place (discrete-text-sequence), "sun" in coral
      const SEQUENCE = [
        { t: 0.0, html: "shh." },
        { t: 2.2, html: 'someone is asleep in the <span class="hook01-coral">sun</span>.' },
      ];
      function htmlAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].html;
        }
        return SEQUENCE[0].html;
      }
      let shown = null;
      function render(time) {
        const next = htmlAt(time);
        if (next !== shown) {
          textEl.innerHTML = next;
          shown = next;
        }
      }
      const driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        { t: 4.5, duration: 4.5, ease: "none", onUpdate: () => render(driver.t) },
        0
      );

      // Scene 4 (3.4–4.0s): the pull-back accelerates; caption lifts and fades so the reveal is clean
      tl.fromTo(
        caption,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -24, duration: 0.6, ease: "power3.in", immediateRender: false },
        3.4
      );

      tl.set({}, {}, 4.5);
      render(0);
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
