  <div id="root" data-composition-id="02-intro" data-width="1920" data-height="1080" data-start="0" data-duration="3.5">
    <!-- approved frame video hoisted by assemble-index -->

    <div id="intro02-type" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
      <div id="intro02-lockup">
        <h1 id="intro02-wordmark" aria-label="Cat Room">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var root = document.querySelector('[data-composition-id="02-intro"]');
      var one = function (sel) { return root.querySelector(sel); };
      var all = function (sel) { return root.querySelectorAll(sel); };
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.4s): footage only — the pull-back decelerates and the room settles centre-right.
      tl.set({}, {}, 0);

      // Scene 2 (1.4–2.4s): the one move — "Cat Room" assembles letter by letter in the open sky.
      tl.fromTo(
        all(".intro02-char"),
        { opacity: 0, y: 64 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.035 },
        1.4
      );
      // the coral spike pops in last, beside the wordmark — scale 0.6 -> 1, no overshoot

        one("#intro02-spike"),
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.95
      );

      // Scene 3 (2.4–3.5s): the line fades up beneath, then holds dead still.
      tl.fromTo(
        one("#intro02-tagline"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        2.4
      );

      // hold to the end of the frame (no exit — the root transition owns it)
      tl.set({}, {}, 3.5);

      window.__timelines["02-intro"] = tl;
    })();
  </script>
