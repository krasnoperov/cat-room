<template id="02-intro-template">
  <div id="root" data-composition-id="02-intro" data-width="1920" data-height="1080" data-start="0" data-duration="4">
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2");
        font-style: italic;
        font-weight: 100 900;
        font-display: block;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        container-type: size;
        --02-intro-ink: #41384d;
        --02-intro-cream: #fffaf3;
        --02-intro-coral: #e0894a;
      }

      [data-02-intro-layer] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Translucent veil card behind the type only — the room stays at full strength. */
      [id="02-intro-veil"] {
        position: absolute;
        left: 4.2cqw;
        top: 6.4cqw;
        width: 31.5cqw;
        height: 32cqw;
        border-radius: 12px;
        background: rgba(255, 250, 243, 0.8);
        border: 1px solid rgba(65, 56, 77, 0.12);
        box-shadow: 0 1px 3px rgba(65, 56, 77, 0.08), 0 4px 16px rgba(65, 56, 77, 0.04);
        opacity: 0;
      }

      [id="02-intro-lockup"] {
        position: absolute;
        left: 6.9cqw;
        top: 8.6cqw;
        width: 25.5cqw;
        color: var(--02-intro-ink);
      }

      [id="02-intro-wordmark"] {
        position: relative;
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 400;
        font-style: normal;
        font-size: 9.9cqw;
        line-height: 0.98;
        letter-spacing: -0.028em;
        color: var(--02-intro-ink);
        opacity: 0;
      }

      [id="02-intro-wordmark"] span {
        display: block;
        white-space: nowrap;
      }

      [id="02-intro-spike"] {
        position: absolute;
        left: 17.2cqw;
        top: 1.2cqw;
        font-family: "Fraunces", Georgia, serif;
        font-size: 3.4cqw;
        line-height: 1;
        color: var(--02-intro-coral);
        opacity: 0;
      }

      [id="02-intro-line"] {
        margin: 2.1cqw 0 0 0.3cqw;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: 2.08cqw;
        line-height: 1.3;
        letter-spacing: -0.012em;
        color: var(--02-intro-ink);
        opacity: 0;
      }
    </style>

    <!-- approved frame video hoisted by assemble-index -->

    <div class="clip" data-02-intro-layer id="02-intro-type" data-start="0" data-duration="4" data-track-index="1">
      <div id="02-intro-veil"></div>
      <div id="02-intro-lockup">
        <h1 id="02-intro-wordmark"><span>Cat</span><span>Room</span></h1>
        <div id="02-intro-spike" aria-hidden="true">&#x2731;</div>
        <p id="02-intro-line">a little world<br />that lives on its own</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var root = document.querySelector('[data-composition-id="02-intro"]');
        var q = function (sel) { return root.querySelector(sel); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.8s): footage only — the clip's own slow push-in is the camera.
        tl.set({}, {}, 0);

        // Scene 2 (0.8–2.2s): the one move — wordmark rises in by slide-up crossfade, veil behind it.
        tl.fromTo(q('[id="02-intro-veil"]'),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.8);
        tl.fromTo(q('[id="02-intro-wordmark"]'),
          { opacity: 0, y: 56 },
          { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.9);
        // The coral spike: fade + scale 0.92 -> 1 on a single emphasis beat, never spins.
        tl.fromTo(q('[id="02-intro-spike"]'),
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 1.5);

        // Scene 3 (2.2–4.0s): the line fades up under the wordmark, then holds.
        tl.fromTo(q('[id="02-intro-line"]'),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 2.2);

        // Hold to the end of the frame (no exit — the root transition owns it).
        tl.set({}, {}, 4);

        window.__timelines["02-intro"] = tl;
      })();
    </script>
  </div>
</template>
