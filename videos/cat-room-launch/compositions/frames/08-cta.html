    <style>

    </style>

    <!-- approved frame video hoisted by assemble-index -->

    <div id="cta08-sky" class="clip cta08-sky" data-start="0" data-duration="8" data-track-index="1"></div>

    <div id="cta08-stage" class="clip cta08-stage" data-start="0" data-duration="8" data-track-index="2">
      <h1 id="cta08-wordmark" class="cta08-wordmark" role="img" aria-label="Cat Room"><span class="cta08-letter">C</span><span class="cta08-letter">a</span><span class="cta08-letter">t</span><span class="cta08-letter cta08-space"> </span><span class="cta08-letter">R</span><span class="cta08-letter">o</span><span class="cta08-letter">o</span><span class="cta08-letter">m</span><span id="cta08-mark" class="cta08-mark" aria-hidden="true"><span id="cta08-glow" class="cta08-glow"></span><svg id="cta08-spike" class="cta08-spike" viewBox="0 0 100 100"><line x1="50" y1="50" x2="50" y2="9" /><line x1="50" y1="50" x2="79" y2="21" /><line x1="50" y1="50" x2="91" y2="50" /><line x1="50" y1="50" x2="79" y2="79" /><line x1="50" y1="50" x2="50" y2="91" /><line x1="50" y1="50" x2="21" y2="79" /><line x1="50" y1="50" x2="9" y2="50" /><line x1="50" y1="50" x2="21" y2="21" /></svg></span></h1>
      <p id="cta08-url" class="cta08-url" aria-label="rooms.krasnoperov.me"></p>
      <p id="cta08-credit" class="cta08-credit">made with Claude · Blender · makefx</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME = "08-cta";
        var DURATION = 8;
        var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        var one = function (id) { return root.querySelector('[id="' + id + '"]'); };
        var all = function (cls) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + cls + '"]')); };

        // ---- Stars: deterministic field from a seeded hash (mulberry32), no Math.random ----
        var seed = 0x0c47a11 >>> 0;
        var rand = function () {
          seed = (seed + 0x6d2b79f5) >>> 0;
          var t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        var SKY_BOTTOM = 590;          // upper ~55% of the frame only
        var LOCKUP = { x0: 430, x1: 1490, y0: 0, y1: 360 }; // never behind the lockup text
        var ROOM = { x0: 640, x1: 1280, y0: 420 };            // the receding room's crown
        var stars = [];
        var guard = 0;
        while (stars.length < 70 && guard < 5000) {
          guard++;
          var x = 28 + rand() * (1920 - 56);
          var y = 22 + rand() * (SKY_BOTTOM - 22);
          var size = 1.5 + rand() * 2.0;
          var level = 0.52 + rand() * 0.16;
          var jitter = rand();
          if (x > LOCKUP.x0 && x < LOCKUP.x1 && y > LOCKUP.y0 && y < LOCKUP.y1) continue;
          if (x > ROOM.x0 && x < ROOM.x1 && y > ROOM.y0) continue;
          var crowded = false;
          for (var k = 0; k < stars.length; k++) {
            var dx = stars[k].x - x, dy = stars[k].y - y;
            if (dx * dx + dy * dy < 46 * 46) { crowded = true; break; }
          }
          if (crowded) continue;
          stars.push({ x: x, y: y, size: size, level: level, jitter: jitter });
        }
        // The sky opens from the edges inward as the room recedes: farthest stars first.
        stars.forEach(function (s) {
          var dx = (s.x - 960) / 960, dy = (s.y - 900) / 900;
          s.dist = Math.sqrt(dx * dx + dy * dy);
        });
        var order = stars.slice().sort(function (a, b) { return b.dist - a.dist; });
        order.forEach(function (s, rank) { s.rank = rank; });

        var sky = one("cta08-sky");
        stars.forEach(function (s, i) {
          var el = document.createElement("span");
          el.id = "cta08-star-" + i;
          el.className = "cta08-star";
          el.style.left = (s.x - s.size / 2).toFixed(1) + "px";
          el.style.top = (s.y - s.size / 2).toFixed(1) + "px";
          el.style.width = s.size.toFixed(2) + "px";
          el.style.height = s.size.toFixed(2) + "px";
          sky.appendChild(el);
          s.el = el;
        });

        // ---- URL characters: per-char spans so tracking settles on the compositor ----
        var URL = "rooms.krasnoperov.me";
        var urlEl = one("cta08-url");
        var chars = Array.from(URL).map(function (c, i) {
          var span = document.createElement("span");
          span.id = "cta08-char-" + i;
          span.className = "cta08-char";
          span.setAttribute("aria-hidden", "true");
          span.textContent = c;
          urlEl.appendChild(span);
          return span;
        });

        var wordmark = one("cta08-wordmark");
        var letters = all("cta08-letter");
        var spike = one("cta08-spike");
        var glow = one("cta08-glow");
        var credit = one("cta08-credit");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-2.8s): footage only. The room turns, lamps lit; no type while it turns.
        tl.set({}, {}, 0);

        // Scene 2 (2.8-4.6s): stars come out, each on its own time, one finite twinkle 0.3 -> 1 -> ~0.6.
        stars.forEach(function (s) {
          var t = 1.6 + (s.rank / (stars.length - 1)) * 1.45 + s.jitter * 0.15;
          tl.fromTo(s.el,
            { opacity: 0, scale: 0.5 },
            { opacity: 0.3, scale: 1, duration: 0.34, ease: "power3.out" }, t);
          tl.to(s.el, { opacity: 1, duration: 0.22, ease: "power3.out" }, t + 0.34);
          tl.to(s.el, { opacity: s.level, duration: 0.7, ease: "expo.out" }, t + 0.56);
        });

        // Scene 2: the wordmark cascades in (logo-brand-close cascade): per-letter fade + rise,
        // long expo tail, while the whole word settles from 1.04 to 1.
        var CASCADE_AT = 1.8;
        tl.fromTo(letters,
          { opacity: 0, y: "0.62em" },
          { opacity: 1, y: "0em", duration: 1.15, ease: "expo.out", stagger: { amount: 0.7, from: "start" } },
          CASCADE_AT);
        tl.fromTo(wordmark,
          { scale: 1.04, transformOrigin: "50% 100%" },
          { scale: 1, duration: 2.4, ease: "expo.out" },
          CASCADE_AT);

        // Scene 3 (4.6-5.6s): the coral spike arrives last, the brand-period beat; one glow bloom.
        tl.fromTo(spike,
          { opacity: 0, scale: 0.2, y: "0.08em", transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, y: "0em", duration: 0.9, ease: "expo.out" },
          3.4);
        tl.fromTo(glow,
          { opacity: 0, scale: 0.35 },
          { opacity: 1, scale: 1.15, duration: 0.45, ease: "power3.out" },
          3.42);
        tl.to(glow, { opacity: 0.38, scale: 1, duration: 1.0, ease: "expo.out" }, 3.87);

        // Scene 4 (5.6-8.0s): the URL settles beneath, tracking easing from ~0.5em to 0.18em
        // (per-char x offsets converge on the set tracking, so the settle stays smooth under seek).
        var fontPx = 44;
        var extra = (0.5 - 0.18) * fontPx;
        var mid = (chars.length - 1) / 2;
        tl.fromTo(chars,
          { opacity: 0, x: function (i) { return (i - mid) * extra; } },
          { opacity: 1, x: 0, duration: 1.3, ease: "expo.out" },
          4.4);

        // 6.4s: the credit fades in beneath, cream at 70%.
        tl.fromTo(credit,
          { opacity: 0, y: 10 },
          { opacity: 0.7, y: 0, duration: 0.9, ease: "power3.out" },
          5.2);

        // Final frame: hold dead still to the last frame, no exit.
        tl.set({}, {}, DURATION);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME] = tl;
      })();
    </script>
