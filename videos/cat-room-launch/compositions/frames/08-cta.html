    <script>
      (function () {
        var FRAME = "08-cta";
        var DURATION = 5.5;
        var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        var q = function (cls) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + cls + '"]')); };

        var letters = q("08-cta-letter");
        var lockup = q("08-cta-lockup");
        var spike = q("08-cta-spike");
        var spokes = Array.prototype.slice.call(spike[0].querySelectorAll("line"));
        var chars = q("08-cta-char");
        var caret = q("08-cta-caret");
        var credit = q("08-cta-credit");

        var tl = gsap.timeline({ paused: true });

        // Life in the hold: the whole lockup creeps up in scale across the frame.
        tl.fromTo(lockup, { scale: 0.985 }, { scale: 1.015, duration: DURATION, ease: "none" }, 0);

        // Scene 1 (0.0–1.4s): "Cat Room" assembles letter by letter, per-letter staggered rise.

          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 },
          0.12);

        // Scene 2 (1.4–2.8s): the coral spike draws in beside the wordmark (svg-path-draw, spokes from center).

          { opacity: 1, scale: 1, duration: 0.7, ease: "power1.out" }, 1.4);
        spokes.forEach(function (s, i) {
          tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 1.42 + i * 0.06);
        });

        // Scene 2: the URL types in beneath in coral mono.
        var TYPE_START = 1.95, PER_CHAR = 0.042;
        tl.set(caret, { opacity: 1 }, TYPE_START - 0.08);
        chars.forEach(function (c, i) {
          tl.set(c, { opacity: 1 }, TYPE_START + i * PER_CHAR);
        });
        var typedEnd = TYPE_START + chars.length * PER_CHAR;
        // Two deterministic caret blinks, then it retires so the URL holds clean.
        tl.set(caret, { opacity: 0 }, typedEnd + 0.25);
        tl.set(caret, { opacity: 1 }, typedEnd + 0.5);
        tl.set(caret, { opacity: 0 }, typedEnd + 0.75);
