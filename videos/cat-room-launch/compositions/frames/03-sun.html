<template>
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-normal-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("assets/fonts/fraunces-italic-latin.woff2") format("woff2");
      font-style: italic;
      font-weight: 100 900;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      color: #fffaf3;
    }

    /* translucent veil strip behind the type only; the footage stays full strength elsewhere */
    #sun-03-veil {
      position: absolute;
      left: 48px;
      top: 500px;
      width: 1500px;
      height: 380px;
      border-radius: 12px;
      background: rgba(24, 22, 21, 0.34);
    }

    /* clock readout — cream pill, top-left inside slide-pad */
    #sun-03-clock {
      position: absolute;
      left: 80px;
      top: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px 14px 24px;
      border-radius: 9999px;
      background: #fffaf3;
      border: 1px solid rgba(65, 56, 77, 0.12);
      box-shadow: 0 1px 3px rgba(65, 56, 77, 0.08), 0 4px 16px rgba(65, 56, 77, 0.04);
      color: #41384d;
      font-family: "JetBrains Mono", monospace;
      font-weight: 400;
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #sun-03-clock-dot {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background: #41384d;
    }
    #sun-03-clock-time {
      display: inline-block;
      width: 5.6em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    /* headline block, lower-left third */
    .sun-03-line {
      position: absolute;
      left: 104px;
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: 7.3cqw;
      line-height: 1.02;
      letter-spacing: -0.022em;
      white-space: nowrap;
      color: #fffaf3;
    }
    #sun-03-line1 { top: 536px; }
    #sun-03-line2 { top: 700px; }

    .sun-03-word {
      display: inline-block;
      margin-right: 0.24em;
    }
    .sun-03-word:last-child { margin-right: 0; }

    /* coral marker under "follows" */
    .sun-03-mark-wrap {
      position: relative;
      display: inline-block;
    }
    .sun-03-mark-text {
      position: relative;
      z-index: 1;
    }
    #sun-03-marker {
      position: absolute;
      left: -6px;
      right: -6px;
      bottom: 0.06em;
      height: 16px;
      border-radius: 6px;
      background: #e0894a;
      transform-origin: left center;
      z-index: 0;
    }
  </style>

  <div id="root" data-composition-id="03-sun" data-width="1920" data-height="1080" data-duration="5.5">
    <!-- approved frame video hoisted by assemble-index -->

    <div id="sun-03-veil" class="clip" data-start="0" data-duration="5.5" data-track-index="1"></div>

    <div id="sun-03-clock" class="clip" data-start="0" data-duration="5.5" data-track-index="2">
      <span id="sun-03-clock-dot"></span>
      <span id="sun-03-clock-time">09:00</span>
    </div>

    <h1 id="sun-03-line1" class="sun-03-line clip" data-start="0" data-duration="5.5" data-track-index="3">
      <span class="sun-03-word">The</span><span class="sun-03-word">sun</span><span class="sun-03-word">moves.</span>
    </h1>

    <h1 id="sun-03-line2" class="sun-03-line clip" data-start="0" data-duration="5.5" data-track-index="4">
      <span class="sun-03-word">The</span><span class="sun-03-word">cat</span><span class="sun-03-word sun-03-mark-wrap"><span id="sun-03-marker"></span><span class="sun-03-mark-text">follows</span></span><span class="sun-03-word">it.</span>
    </h1>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="03-sun"]');
      const q = (sel) => root.querySelectorAll(sel);
      const one = (sel) => root.querySelector(sel);
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.4s): clock pill settles in; readout counts 09:00 → 22:00 linearly over the whole frame
      const clockText = one("#sun-03-clock-time");
      const clock = { minutes: 9 * 60 };
      const pad = (n) => (n < 10 ? "0" + n : "" + n);
      const renderClock = () => {
        const m = Math.round(clock.minutes);
        clockText.textContent = pad(Math.floor(m / 60)) + ":" + pad(m % 60);
      };
      tl.fromTo(
        one("#sun-03-clock"),
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        0
      );
      tl.fromTo(
        one("#sun-03-veil"),
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        0.2
      );
      tl.fromTo(
        clock,
        { minutes: 9 * 60 },
        { minutes: 22 * 60, duration: 5, ease: "none", onUpdate: renderClock },
        0
      );

      // Scene 2 (0.4–2.0s): "The sun moves." per-word reveal
      tl.fromTo(
        q("#sun-03-line1 .sun-03-word"),
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.16 },
        0.4
      );

      // Scene 3 (2.0–5.0s): "The cat follows it." lands beneath, then the coral marker sweeps under "follows"
      tl.fromTo(
        q("#sun-03-line2 .sun-03-word"),
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.14 },
        2.0
      );
      tl.fromTo(
        one("#sun-03-marker"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        2.75
      );

      // hold to 5.0s while the footage keeps moving
      tl.set({}, {}, 5);

      renderClock();
      window.__timelines["03-sun"] = tl;
    })();
  </script>
</template>
