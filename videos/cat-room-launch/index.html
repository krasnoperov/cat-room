<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFAF3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2; /* type and cards over the footage */
      }
      #root > video { z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
            <audio id="music-bed" class="clip" src="assets/music.mp3" data-start="0" data-duration="35" data-track-index="9000" data-volume="0.9"></audio>

      <div
        id="el-04-dresser"
        class="scene"
        data-composition-id="04-dresser"
        data-composition-src="compositions/frames/04-dresser.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-03-sun"
        class="scene"
        data-composition-id="03-sun"
        data-composition-src="compositions/frames/03-sun.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-mine"
        class="scene"
        data-composition-id="05-mine"
        data-composition-src="compositions/frames/05-mine.html"
        data-start="10"
        data-duration="8"
        data-track-index="0"
      ></div>

      <div
        id="el-09-moments"
        class="scene"
        data-composition-id="09-moments"
        data-composition-src="compositions/frames/09-moments.html"
        data-start="17.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-dusk"
        class="scene"
        data-composition-id="07-dusk"
        data-composition-src="compositions/frames/07-dusk.html"
        data-start="22.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="27.5"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <video id="el-04-dresser-video-3" src="assets/clips/c11-ui-dresser.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="0"
        data-duration="5"
        data-track-index="1000"
      ></video>
      <video id="sun-03-footage" src="assets/clips/c09-timelapse.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="5"
        data-duration="5"
        data-track-index="3000"
      ></video>
      <video id="el-05-mine-video-1" src="assets/clips/c03-box.mp4" data-media-start="0.6" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="10"
        data-duration="2.5"
        data-track-index="5000"
      ></video>
      <video id="el-05-mine-video-2" src="assets/clips/c04-yarn.mp4" data-media-start="0.6" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="12.5"
        data-duration="2.5"
        data-track-index="5000"
      ></video>
      <video id="el-05-mine-video-3" src="assets/clips/c05-laser.mp4" data-media-start="1.5" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="15"
        data-duration="2.5"
        data-track-index="5000"
      ></video>
      <video id="m09-footage" src="assets/clips/c13-album.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="17.5"
        data-duration="5.5"
        data-track-index="6500"
      ></video>
      <video id="d07-footage" src="assets/clips/c08-dusk-radio.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="22.5"
        data-duration="5"
        data-track-index="7000"
      ></video>
      <video id="el-08-cta-video-7" src="assets/clips/c12-finale.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="27.5"
        data-duration="7.5"
        data-track-index="8000"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-05-mine", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-09-moments", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.to("#el-09-moments", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22.5);
        tl.fromTo("#el-07-dusk", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22.5);
        tl.to("#el-07-dusk", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27.5);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27.5);
        tl.to({}, { duration: 35 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
