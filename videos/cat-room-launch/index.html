<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFAF3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2; /* type and cards over the footage */
      }
      #root > video { z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43.5"
      data-width="1920"
      data-height="1080"
    >
      <audio id="music-bed" class="clip" src="assets/music.mp3" data-start="0" data-duration="43.5" data-track-index="9000" data-volume="0.9"></audio>

      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4.5"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-sun"
        class="scene"
        data-composition-id="03-sun"
        data-composition-src="compositions/frames/03-sun.html"

        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-dresser"
        class="scene"
        data-composition-id="04-dresser"
        data-composition-src="compositions/frames/04-dresser.html"

        data-track-index="1"
      ></div>

      <div
        id="el-05-mine"

        data-composition-id="05-mine"

      <div
        id="el-07-dusk"
        class="scene"

        data-track-index="1"
      ></div>

      <video id="hook01-video" src="assets/clips/c00-hook-pullback.mp4" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="0"
        data-duration="4.5"
        data-track-index="1000"
      ></video>

      <video id="el-02-intro-video-1" src="assets/clips/c00-hook-pullback.mp4" data-media-start="4.5" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="4.5"

        data-track-index="2000"
      ></video>

      <video id="el-08-cta-video-7" src="assets/clips/c12-finale.mp4" data-media-start="0" muted playsinline

        data-start="35.5"

        data-track-index="8000"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-03-sun", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-04-dresser", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-05-mine", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-06-world", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.to("#el-06-world", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 30.5);
        tl.fromTo("#el-07-dusk", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 30.5);
        tl.to("#el-07-dusk", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 35.5);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 35.5);
        tl.to({}, { duration: 43.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
